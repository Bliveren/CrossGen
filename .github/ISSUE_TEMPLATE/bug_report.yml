name: Bug report
description: Report a reproducible problem in the desktop app, CLI, or MCP server
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Remove API keys, private images, local paths, and sensitive provider responses before submitting.
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Desktop app
        - JSON CLI
        - MCP server
        - Packaging or installation
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CrossGen version
      placeholder: "For example: v0.3.1"
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - macOS arm64
        - Windows x64
        - Linux x64
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Run...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Include relevant JSON output or logs only after removing credentials and private data.
      render: shell
  - type: checkboxes
    id: confirmations
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: I removed API keys, private images, local paths, and other sensitive data.
          required: true